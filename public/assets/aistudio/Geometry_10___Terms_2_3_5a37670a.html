<style>
/* Layout: graph-paper ground; sticky term ribbon; sidebar index + one working pane (lesson / lab / assessment) */
:root {
  --paper: #f6f8fb;
  --sheet: #ffffff;
  --grid: #e3e9f2;
  --ink: #18233a;
  --ink-2: #4a566d;
  --ink-3: #7b8699;
  --rule: #d6dde8;
  --cobalt: #2450b8;
  --cobalt-soft: #e7eefc;
  --marker: #f4b400;
  --marker-soft: #fff3cc;
  --u1: #2450b8; --u1s: #e7eefc;
  --u2: #0f8a7a; --u2s: #e0f4f0;
  --u3: #b4462c; --u3s: #fbe9e3;
  --good: #1d7a46; --good-s: #e2f3e9;
  --warn: #9a6200; --warn-s: #fff1d6;
  --f-display: "Familjen Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }
body {
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px;
  color: var(--ink);
  font: 16px/1.55 var(--f-body);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }
a { color: var(--cobalt); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--marker); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
.top { background: var(--sheet); border-bottom: 1px solid var(--rule); }
.top .wrap { padding-block: 22px 18px; display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: end; }
.eyebrow { font: 600 12px/1.2 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.top h1 { font-size: clamp(26px, 3.4vw, 38px); margin-top: 6px; }
.top h1 span { color: var(--cobalt); }
.top .sub { color: var(--ink-2); margin-top: 6px; max-width: 70ch; }
.stats { display: flex; gap: 22px; flex-wrap: wrap; }
.stat b { display: block; font: 700 26px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat small { color: var(--ink-3); font-size: 13px; }

/* ribbon */
.ribbon { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: rgba(255,255,255,.96); backdrop-filter: blur(6px); border-bottom: 1px solid var(--rule); }
.ribbon .wrap { padding-block: 10px; display: flex; gap: 14px; align-items: center; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab { border: 1px solid transparent; background: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; color: var(--ink-2); text-decoration: none; font-size: 15px; }
.tab:hover { background: var(--cobalt-soft); color: var(--cobalt); }
.tab[aria-current="true"] { background: var(--ink); color: #fff; }
.cells { flex: 1; min-width: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(8px, 1fr); gap: 2px; height: 26px; }
.cell { border: 0; border-radius: 2px; cursor: pointer; position: relative; padding: 0; opacity: .35; }
.cell:hover, .cell.on { opacity: 1; }
.cell.on { outline: 2px solid var(--ink); outline-offset: 1px; }
.cell.as::after { content: ""; position: absolute; left: 50%; top: -5px; transform: translateX(-50%); border: 4px solid transparent; border-top-color: var(--ink); }
.cell.sat { background: var(--ink) !important; opacity: .8; }

/* main grid */
.main .wrap { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 28px; padding-block: 26px 80px; }
.side { position: sticky; top: 64px; align-self: start; max-height: calc(100vh - 80px); overflow: auto; padding-right: 6px; }
.side h4 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin: 18px 0 6px; font-family: var(--f-mono); font-weight: 600; }
.side h4:first-child { margin-top: 0; }
.side .unit { font: 700 14px/1.3 var(--f-display); margin: 14px 0 4px; display: flex; gap: 8px; align-items: center; }
.side .unit i { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.side a.item { display: grid; grid-template-columns: 30px 1fr; gap: 6px; padding: 4px 8px; border-radius: 6px; color: var(--ink-2); text-decoration: none; font-size: 14.5px; line-height: 1.3; }
.side a.item:hover { background: var(--sheet); color: var(--ink); }
.side a.item[aria-current="true"] { background: var(--sheet); color: var(--ink); box-shadow: inset 3px 0 0 var(--cobalt); font-weight: 600; }
.side a.item span:first-child { font: 600 12px/1.6 var(--f-mono); color: var(--ink-3); }
.side .tag { display: inline-block; font: 700 10px/1 var(--f-mono); padding: 3px 5px; border-radius: 3px; background: var(--ink); color: #fff; margin-left: 4px; vertical-align: 1px; }
.mnav { display: none; }

/* sheet */
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: clamp(18px, 3vw, 36px); min-width: 0; }
.view-head { display: grid; gap: 8px; margin-bottom: 22px; }
.view-head h2 { font-size: clamp(26px, 3vw, 36px); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 600 12px/1 var(--f-mono); padding: 5px 8px; border-radius: 4px; background: var(--cobalt-soft); color: var(--cobalt); }
.chip.dark { background: var(--ink); color: #fff; }
.chip.gold { background: var(--marker-soft); color: var(--warn); }
.lead { font-size: 18px; color: var(--ink-2); max-width: 72ch; }

.cols { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 30px; }
.aside { display: grid; gap: 16px; align-content: start; }
.box { border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; }
.box h4 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-family: var(--f-mono); margin-bottom: 8px; font-weight: 600; }
.box ul { margin: 0; padding-left: 18px; }
.box li { margin: 4px 0; }
.book { background: var(--marker-soft); border-color: #f1dc9a; }
.book p { margin: 6px 0; font-size: 15px; }
.book b { font-family: var(--f-display); }
.checks label { display: flex; gap: 8px; align-items: flex-start; margin: 6px 0; cursor: pointer; font-size: 15px; }
.checks input { margin-top: 4px; accent-color: var(--good); }
.vocab { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.vocab td { padding: 4px 4px; border-top: 1px solid var(--rule); vertical-align: top; }
.vocab td:first-child { font-weight: 600; }
.vocab td:not(:first-child) { color: var(--ink-2); }

/* lesson stages */
.flow { display: grid; gap: 0; counter-reset: st; min-width: 0; grid-template-columns: minmax(0, 1fr); }
.stage > div, .aside { min-width: 0; }
.aside { grid-template-columns: minmax(0, 1fr); }
.vocab { table-layout: fixed; }
.vocab td { overflow-wrap: anywhere; }
.stage { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 14px; padding: 18px 0; border-top: 1px dashed var(--rule); }
.stage:first-child { border-top: 0; padding-top: 0; }
.stage .num { font: 700 13px/1 var(--f-mono); color: var(--ink-3); padding-top: 6px; }
.stage .num b { display: block; font: 700 22px/1 var(--f-display); color: var(--ink); margin-bottom: 4px; }
.stage h3 { font-size: 20px; margin-bottom: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
.stage h3 small { font: 500 12px/1 var(--f-mono); color: var(--ink-3); }
.stage p { margin: 8px 0; max-width: 74ch; }
.cpa { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 4px; }
.cpa > div { border-radius: 8px; padding: 12px 14px; background: var(--paper); border: 1px solid var(--rule); min-width: 0; }
.cpa h5 { margin: 0 0 6px; font: 700 12px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; }
.cpa .c h5 { color: var(--u2); } .cpa .p h5 { color: var(--cobalt); } .cpa .a h5 { color: var(--u3); }
.cpa p { margin: 0; font-size: 15px; }
.key { border: 2px solid var(--ink); border-radius: 8px; padding: 14px 18px; margin: 10px 0; background: var(--sheet); position: relative; overflow-x: auto; }
.key::before { content: "KEY IDEA"; position: absolute; top: -9px; left: 12px; background: var(--sheet); padding: 0 6px; font: 700 11px/1.2 var(--f-mono); letter-spacing: .08em; }
.ex { border-left: 3px solid var(--cobalt); padding: 4px 0 4px 16px; margin: 14px 0; }
.ex .q { font-weight: 600; }
.ex ol { margin: 6px 0; padding-left: 20px; }
.ex li { margin: 3px 0; }
.ex .lbl { font: 700 12px/1 var(--f-mono); color: var(--cobalt); letter-spacing: .05em; }
.tiers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tier { border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; min-width: 0; }
.tier h5 { margin: 0 0 6px; font: 700 13px/1.2 var(--f-display); display: flex; justify-content: space-between; gap: 6px; }
.tier h5 i { font-style: normal; font: 600 11px/1.4 var(--f-mono); color: var(--ink-3); }
.tier ol { margin: 0; padding-left: 20px; }
.tier li { margin: 6px 0; font-size: 15px; }
.ans { display: none; color: var(--good); background: var(--good-s); border-radius: 4px; padding: 2px 6px; margin-top: 3px; font-size: 14px; }
.show-ans .ans { display: block; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--ink); background: var(--sheet); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; text-decoration: none; color: var(--ink); }
.btn:hover { background: var(--ink); color: #fff; }
.btn.blue { border-color: var(--cobalt); color: var(--cobalt); }
.btn.blue:hover { background: var(--cobalt); color: #fff; }
.btn.solid { background: var(--cobalt); color: #fff; border-color: var(--cobalt); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.note { background: var(--warn-s); border-radius: 8px; padding: 12px 14px; font-size: 15px; }
.note b { color: var(--warn); }
.sasbar { background: var(--ink); color: #fff; border-radius: 8px; padding: 12px 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 18px; }
.sasbar a { color: var(--marker); font-weight: 700; }
.pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--rule); flex-wrap: wrap; }

/* overview */
.units { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin: 18px 0 30px; }
.ucard { border-radius: 10px; padding: 16px 18px; border: 1px solid var(--rule); display: grid; gap: 8px; align-content: start; }
.ucard h3 { font-size: 20px; }
.ucard .meta { font: 600 12px/1 var(--f-mono); }
.ucard p { margin: 0; font-size: 15px; color: var(--ink-2); }
.ucard ul { margin: 0; padding-left: 18px; font-size: 14.5px; }
.cycle { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; margin: 14px 0 30px; }
.cycle div { padding: 14px; border-right: 1px solid var(--rule); }
.cycle div:last-child { border-right: 0; }
.cycle b { font: 700 12px/1 var(--f-mono); color: var(--ink-3); }
.cycle h4 { font-size: 17px; margin: 6px 0 4px; }
.cycle p { margin: 0; font-size: 14px; color: var(--ink-2); }
table.plan { width: 100%; border-collapse: collapse; font-size: 14.5px; }
table.plan th { text-align: left; font: 600 12px/1.2 var(--f-mono); text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); padding: 8px; border-bottom: 2px solid var(--ink); }
table.plan td { padding: 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.plan tr:hover td { background: var(--paper); cursor: pointer; }
table.plan td:first-child { font: 600 13px/1.4 var(--f-mono); color: var(--ink-3); white-space: nowrap; }
.tbl { overflow-x: auto; }
.section-title { font-size: 22px; margin: 34px 0 6px; }

/* labs */
.labgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.labcard { border: 1px solid var(--rule); border-radius: 10px; padding: 16px; display: grid; gap: 6px; text-decoration: none; color: var(--ink); }
.labcard:hover { border-color: var(--cobalt); box-shadow: 0 2px 0 var(--cobalt); }
.labcard h3 { font-size: 19px; }
.labcard p { margin: 0; color: var(--ink-2); font-size: 15px; }
.lab { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 22px; }
.ctrl { display: grid; gap: 14px; align-content: start; }
.ctrl label { font: 600 12px/1.2 var(--f-mono); text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); display: block; margin-bottom: 6px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { border: 1px solid var(--rule); background: var(--sheet); padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 14px; min-width: 38px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
input[type=range] { width: 100%; accent-color: var(--cobalt); }
input[type=number], input[type=text], select { width: 100%; padding: 7px 9px; border: 1px solid var(--rule); border-radius: 6px; font: 15px var(--f-body); background: var(--sheet); color: var(--ink); }
.canvases { display: grid; gap: 14px; min-width: 0; }
.canvases.two { grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); }
canvas { width: 100%; max-width: 100%; display: block; border: 1px solid var(--rule); border-radius: 8px; background: #fff; }
.out { border: 2px solid var(--ink); border-radius: 8px; padding: 12px 16px; overflow-x: auto; min-width: 0; }
.out .big { font-size: 18px; }
.mono { font-family: var(--f-mono); font-size: 14px; }
.dtable { border-collapse: collapse; font: 14px var(--f-mono); font-variant-numeric: tabular-nums; }
.dtable td, .dtable th { border: 1px solid var(--rule); padding: 5px 9px; text-align: right; }
.dtable th { background: var(--paper); font-weight: 600; }
.dtable .hl { background: var(--marker-soft); font-weight: 700; }
.pascal { font: 13px var(--f-mono); text-align: center; line-height: 1.9; overflow-x: auto; }
.pascal span { display: inline-block; min-width: 34px; padding: 0 2px; border-radius: 4px; }
.pascal .row-on span { background: var(--cobalt-soft); }
.pascal span.k { background: var(--marker) !important; font-weight: 700; }

/* assessment */
.asm-tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 2px solid var(--ink); margin-bottom: 18px; }
.asm-tabs button { border: 0; background: none; padding: 8px 14px; cursor: pointer; font-weight: 600; color: var(--ink-2); border-radius: 6px 6px 0 0; }
.asm-tabs button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.paper { max-width: 860px; }
.paper h1 { font-size: 24px; margin: 4px 0 10px; }
.paper h2 { font-size: 20px; margin: 24px 0 8px; }
.paper h3 { font-size: 17px; margin: 18px 0 6px; }
.paper table { border-collapse: collapse; width: 100%; font-size: 14.5px; margin: 10px 0; }
.paper th, .paper td { border: 1px solid var(--rule); padding: 7px 9px; vertical-align: top; text-align: left; }
.paper th { background: var(--paper); font-weight: 700; }
.paper ol { padding-left: 22px; }
.paper li { margin: 6px 0; }
.paper blockquote { margin: 10px 0; padding: 10px 14px; background: var(--paper); border-left: 3px solid var(--cobalt); }
.paper .table-wrap { overflow-x: auto; }
.mjx { overflow-x: auto; }
mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; max-width: 100%; padding: 2px 0; }


/* 3D studio */
.studio { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 18px; }
.st-left { display: grid; gap: 10px; align-content: start; min-width: 0; }
.st-list { border: 1px solid var(--rule); border-radius: 8px; max-height: 520px; overflow: auto; background: var(--sheet); }
.st-row { display: grid; grid-template-columns: 28px minmax(0, 1fr) 26px; gap: 6px; padding: 7px 8px; border-bottom: 1px solid var(--rule); align-items: start; }
.st-row:focus-within { background: var(--cobalt-soft); }
.st-dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid; margin-top: 7px; cursor: pointer; padding: 0; }
.st-in { width: 100%; border: 0; background: transparent; padding: 6px 2px; font-size: 14.5px; color: var(--ink); }
.st-in:focus { outline: none; }
.st-info { font: 12.5px/1.35 var(--f-mono); color: var(--ink-2); padding: 0 2px; overflow-wrap: anywhere; }
.st-info.err { color: var(--u3); }
.st-sl { display: grid; grid-template-columns: 52px minmax(0, 1fr) 52px 30px; gap: 6px; align-items: center; }
.st-sl:empty { display: none; }
.st-mm { padding: 3px 4px !important; font-size: 12px !important; }
.st-play, .st-del { border: 1px solid var(--rule); background: var(--sheet); border-radius: 5px; cursor: pointer; height: 26px; color: var(--ink-2); }
.st-del { border: 0; font-size: 18px; margin-top: 4px; }
.st-del:hover { color: var(--u3); }
.st-help { font-size: 14px; }
.st-help summary { cursor: pointer; font-weight: 600; }
.st-help .dtable td { text-align: left; font-size: 12.5px; }
.st-help .dtable td:first-child { font-family: var(--f-mono); }
.st-tg { display: inline-flex; gap: 4px; align-items: center; font-size: 14px; margin-left: 6px; }
.st-right { min-width: 0; }
.thgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; margin: 10px 0 26px; }
.thcard { border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; display: grid; gap: 8px; align-content: start; background: var(--sheet); }
.thcard h4 { font-size: 17px; }
.thcard .kind { font: 700 11px/1 var(--f-mono); letter-spacing: .07em; text-transform: uppercase; }
.thcard p { margin: 0; font-size: 15px; }
.thcard .fx { background: var(--paper); border-radius: 6px; padding: 6px 10px; overflow-x: auto; }
@media (max-width: 1000px) { .studio { grid-template-columns: minmax(0, 1fr); } }

@media (max-width: 1100px) {
  .cols { grid-template-columns: minmax(0, 1fr); }
  .aside { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .lab { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 860px) {
  .main .wrap { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .mnav { display: block; margin-bottom: 14px; }
  .cpa, .tiers { grid-template-columns: minmax(0, 1fr); }
  .canvases.two { grid-template-columns: minmax(0, 1fr); }
  .top .wrap { grid-template-columns: minmax(0, 1fr); }
  .cells { display: none; }
  .stage { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .stage .num { display: flex; gap: 8px; align-items: baseline; padding: 0; }
}

/* ===== app layer ===== */
.top { background: linear-gradient(180deg, #ffffff 0%, #f4f7fd 100%); }
.top .wrap { grid-template-columns: minmax(0, 1fr) 220px; align-items: center; }
.brand { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.termsw { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; padding: 3px; background: var(--sheet); gap: 2px; margin-top: 12px; flex-wrap: wrap; }
.termsw a { text-decoration: none; color: var(--ink-2); padding: 7px 14px; border-radius: 999px; font-weight: 600; font-size: 14.5px; }
.termsw a[aria-current="true"] { background: var(--ink); color: #fff; }
.termsw a:hover:not([aria-current="true"]) { background: var(--cobalt-soft); color: var(--cobalt); }
#heroCv { width: 220px; height: 170px; border: 0; background: transparent; cursor: pointer; }
.cell.done::before { content: ""; position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%); width: 5px; height: 5px; border-radius: 50%; background: var(--good); }
.side a.item.done span:first-child { color: var(--good); }
.side a.item.done span:first-child::after { content: " ✓"; }

/* home */
.hero2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 24px; align-items: center; margin-bottom: 26px; }
.hero2 h2 { font-size: clamp(28px, 3.4vw, 42px); }
.progress { height: 10px; border-radius: 999px; background: var(--grid); overflow: hidden; margin: 6px 0 4px; }
.progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--u2), var(--cobalt)); border-radius: 999px; }
.cont { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.feat { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin: 14px 0 28px; }
.feat a { border: 1px solid var(--rule); border-radius: 12px; padding: 14px; text-decoration: none; color: var(--ink); display: grid; gap: 4px; background: var(--sheet); transition: transform .15s, box-shadow .15s; }
.feat a:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(24, 35, 58, .08); }
.feat b { font-family: var(--f-display); font-size: 17px; }
.feat span { font-size: 14px; color: var(--ink-2); }
.feat i { font-style: normal; font-size: 22px; }

/* figures */
.fig { border: 1px solid var(--rule); border-radius: 12px; background: #fff; padding: 8px; display: grid; gap: 6px; min-width: 0; }
.fig canvas { border: 0; border-radius: 8px; background: radial-gradient(circle at 50% 40%, #ffffff 0%, #f6f8fc 100%); }
.fig-bar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.fbtn { border: 1px solid var(--rule); background: var(--sheet); border-radius: 999px; padding: 4px 11px; font: 600 13px var(--f-body); color: var(--ink-2); cursor: pointer; text-decoration: none; }
.fbtn:hover { border-color: var(--cobalt); color: var(--cobalt); }
.fbtn.on { background: var(--marker-soft); border-color: #e8c25a; color: var(--warn); }
.fstep { font: 600 12px var(--f-mono); color: var(--ink-3); min-width: 92px; text-align: center; }
.fig-legend { font-size: 13.5px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; min-height: 18px; }
.fig-legend .lg-given, .fig-legend .lg-find { font: 700 10.5px var(--f-mono); letter-spacing: .07em; text-transform: uppercase; padding: 3px 7px; border-radius: 4px; }
.lg-given { background: var(--cobalt-soft); color: var(--cobalt); }
.lg-find { background: #fff1cc; color: #8a5a00; }
.lg-item { background: var(--paper); border-radius: 4px; padding: 2px 7px; }

/* worked examples */
.wex { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 16px; border: 1px solid var(--rule); border-radius: 14px; padding: 16px; margin: 14px 0; background: linear-gradient(180deg, #fff, #fbfcfe); }
.wex .lbl { font: 700 11.5px/1 var(--f-mono); color: var(--cobalt); letter-spacing: .06em; }
.wex .q { font-weight: 600; margin: 8px 0; }
.wsteps { margin: 8px 0; padding-left: 22px; }
.wsteps li { margin: 6px 0; opacity: .18; filter: blur(2px); transition: opacity .25s, filter .25s; }
.wsteps li.shown { opacity: 1; filter: none; }
.wsteps li.cur { background: var(--marker-soft); border-radius: 6px; padding: 2px 6px; margin-left: -6px; }
.wctl { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.wcount { font: 600 12px var(--f-mono); color: var(--ink-3); }
.wex.nofig { grid-template-columns: minmax(0, 1fr); }

/* practice with checks */
.tier li { display: grid; gap: 6px; }
.chk { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.chk input { width: 130px; padding: 5px 8px; font: 14px var(--f-mono); }
.chk button, .mini { border: 1px solid var(--rule); background: var(--sheet); border-radius: 6px; padding: 4px 9px; font: 600 13px var(--f-body); cursor: pointer; color: var(--ink-2); }
.chk button:hover, .mini:hover { border-color: var(--cobalt); color: var(--cobalt); }
.chk .res { font-size: 13.5px; font-weight: 600; }
.chk .res.ok { color: var(--good); }
.chk .res.no { color: var(--u3); }
.lessonbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
.taught[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: #fff; }

.present { position: fixed; inset: 0; z-index: 50; background: #fbfcfe; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; padding: max(14px, env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); }

.pr-top, .pr-bot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

.pr-slide { overflow: auto; padding: 18px clamp(8px, 4vw, 60px); font-size: clamp(17px, 1.6vw, 24px); }
.pr-slide h2 { font-size: clamp(28px, 3.4vw, 50px); margin-bottom: 18px; }
.pr-slide h3 { font-size: clamp(22px, 2.2vw, 32px); margin: 8px 0 12px; }
.pr-slide .wex { font-size: inherit; }
.pr-slide .key { font-size: 1.05em; }
.pr-dots { display: flex; gap: 5px; }

 · 40 min · 25 marks<\/p>\n<p>Name: ______________________ Class: 10 ___ Date: ________<\/p>\n<p><strong>1.<\/strong> The edges of a rectangular parallelepiped are 2,\n3 and 6. Find its diagonal and the sine of the angle between the\ndiagonal and the base with sides 2 and 3. <strong>[3]<\/strong><\/p>\n<p><strong>2.<\/strong> A triangle of area 24 lies in a plane that makes\nan angle of <span class=\"math inline\">\\(60^\\circ\\)<\/span> with a plane\n<span class=\"math inline\">\\(\\alpha\\)<\/span>. Find the area of its\northogonal projection on <span class=\"math inline\">\\(\\alpha\\)<\/span>.\n<strong>[2]<\/strong><\/p>\n<p><strong>3.<\/strong> Where do the points <span\nclass=\"math inline\">\\(A(0;3;-2)\\)<\/span> and <span\nclass=\"math inline\">\\(B(4;0;0)\\)<\/span> lie: on which coordinate plane\nor axis? <strong>[2]<\/strong><\/p>\n<p><strong>4.<\/strong> <span class=\"math inline\">\\(A(1;-2;3)\\)<\/span>,\n<span class=\"math inline\">\\(B(5;0;-1)\\)<\/span>. Find a) the coordinates\nand the length of <span\nclass=\"math inline\">\\(\\overrightarrow{AB}\\)<\/span>; b) the midpoint of\n<span class=\"math inline\">\\(AB\\)<\/span>; c) the point <span\nclass=\"math inline\">\\(C\\)<\/span> on <span\nclass=\"math inline\">\\(AB\\)<\/span> with <span\nclass=\"math inline\">\\(AC:CB=1:3\\)<\/span>. <strong>[5]<\/strong><\/p>\n<p><strong>5.<\/strong> Find the point on the axis <span\nclass=\"math inline\">\\(Oz\\)<\/span> equidistant from <span\nclass=\"math inline\">\\(A(-2;3;5)\\)<\/span> and <span\nclass=\"math inline\">\\(B(3;-5;1)\\)<\/span>. <strong>[3]<\/strong><\/p>\n<p><strong>6.<\/strong> <span class=\"math inline\">\\(A(1;2;0)\\)<\/span>,\n<span class=\"math inline\">\\(B(3;3;2)\\)<\/span>, <span\nclass=\"math inline\">\\(C(3;0;2)\\)<\/span>. Find the perimeter of <span\nclass=\"math inline\">\\(\\triangle ABC\\)<\/span> and state its type by\nsides. <strong>[3]<\/strong><\/p>\n<p><strong>7.<\/strong> A cube <span\nclass=\"math inline\">\\(ABCDA_1B_ "spec", "name": "Спецификация", "html": "<h1\nid=\"бжб-2-перпендикуляр-және-көлбеулер.-түзу-мен-жазықтық-арасындағы-бұрыш.-қашықтықтар\">БЖБ\n2: Перпендикуляр және көлбеулер. Түзу мен жазықтық арасындағы бұрыш.\nҚашықтықтар<\/h1>\n<p><strong>Сынып:<\/strong> 10 · <strong>Пән:<\/strong> Геометрия ·\n<strong>Тоқсан:<\/strong> 2 · <strong>Сабақ:<\/strong> 9<\/p>\n<p><strong>Ұзақтығы:<\/strong> 25 мин · <strong>Жалпы балл:<\/strong>\n12<\/p>\n<h2 id=\"оқу-мақсаттары\">Оқу мақсаттары<\/h2>\n<ul>\n<li>10.2.8 кеңістіктегі перпендикуляр, көлбеу және көлбеудің проекциясы\nанықтамаларын білу<\/li>\n<li>10.3.1 үш перпендикуляр туралы теореманы білу және оны есептер\nшығаруда қолдану<\/li>\n<li>10.3.2 түзу мен жазықтық арасындағы бұрыштың анықтамасын білу, оны\nсалу және шамасын табу<\/li>\n<li>10.3.5 нүктеден жазықтыққа дейінгі және айқас түзулердің\nарақашықтығын табу; 10.2.10 айқас түзулердің ортақ перпендикулярын\nсалу<\/li>\n<\/ul>\n<h2 id=\"бағалау-критерийлері\">Бағалау критерийлері<\/h2>\n<ul>\n<li>Перпендикуляр, көлбеу және оның проекциясы арасындағы байланысты\nқолданады<\/li>\n<li>Үш перпендикуляр туралы теореманы қолданады<\/li>\n<li>Түзу мен жазықтық арасындағы бұрышты табады<\/li>\n<li>Айқас түзулердің арақашықтығын табады<\/li>\n<\/ul>\n<h2 id=\"ойлау-дағдыларының-деңгейлері\">Ойлау дағдыларының\nдеңгейлері<\/h2>\n<p>Білу және түсіну, Қолдану, Жоғары деңгейлі ойлау дағдылары<\/p>\n<h2 id=\"тапсырмалар-картасы\">Тапсырмалар картасы<\/h2>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Тапсырма<\/th>\n<th>Оқу мақсаты<\/th>\n<th>Ойлау деңгейі<\/th>\n<th>Балл<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>1<\/td>\n<td>10.2.8<\/td>\n<td>Білу және түсіну<\/td>\n<td>2<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>2<\/td>\n<td>10.2.8<\/td>\n<td>Қолдану<\/td>\n<td>3<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>3<\/td>\n<td>10.3.1<\/td>\n<td>Қолдану<\/td>\n<td>3<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>4<\/td>\n<td>10.3.2<\/td>\n<td>Қолдану<\/td>\n<td>2<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>5<\/td>\n<td>10.3.5, 10.2.10<\/td>\n<td>Жоғары деңгейлі ойлау дағдылары<\/td>\n<td>2<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"өткізу-тәртібі\">Өткізу тәртібі<\/h2>\n<p>Екі параллель нұсқа. Калькуляторға рұқсат жоқ. Шешуде қолданылған\nәрбір тік бұрыш негізделуі тиіс.<\/p>\n<h2 id=\"ата-аналарға-кері-байланыс-беруге-арналған-рубрика\">Ата-аналарға\nкері байланыс беруге арналған рубрика<\/h2>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Бағалау критерийі<\/th>\n<th>Төмен<\/th>\n<th>Орта<\/th>\n<th>Жоғары<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Перпендикулярды, көлбеуді, проекцияны қолданады<\/td>\n<td>Элементтерді атауда қиналады<\/td>\n<td>Теңдеу құруда қателеседі<\/td>\n<td>Байланысты дұрыс қолданады<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Үш перпендикуляр туралы теореманы қолданады<\/td>\n<td>Перпендикулярды таңдауда қиналады<\/td>\n<td>Барлық тік бұрыштарды негіздемейді<\/td>\n<td>Теореманы дұрыс қолданады<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Түзу мен жазықтық арасындағы бұрышты табады<\/td>\n<td>Проекцияны табуда қиналады<\/td>\n<td>Есептеуде қателеседі<\/td>\n<td>Бұрышты дұрыс табады<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Айқас түзулердің арақашықтығын табады<\/td>\n<td>Ортақ перпендикулярды салуда қиналады<\/td>\n<td>Оны салады, бірақ есептеуде қателеседі<\/td>\n<td>Арақашықтықты дұрыс табады<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n"}, {"id": "v1", "name": "Нұсқа 1", "html": "<h1 id=\"бжб-2-нұсқа-1\">БЖБ 2 · Нұсқа 1<\/h1>\n<p><strong>Перпендикуляр және көлбеулер. Түзу мен жазықтық арасындағы\nбұрыш. Қашықтықтар<\/strong> · 25 мин · 12 балл<\/p>\n<p>Аты-жөні: ______________________ Сынып: 10 ___ Күні: ________<\/p>\n<p><strong>1.<\/strong> <span class=\"math inline\">\\(PH\\)<\/span> — <span\nclass=\"math inline\">\\(\\alpha\\)<\/span> жазықтығына түсірілген\nперпендикуляр, <span class=\"math inline\">\\(PA\\)<\/span> — көлбеу. <span\nclass=\"math inline\">\\(PA=13\\)<\/span>, <span\nclass=\"math inline\">\\(HA=5\\)<\/span>. <span\nclass=\"math inline\">\\(PH\\)<\/span> табыңыз және <span\nclass=\"math inline\">\\(PA\\)<\/span> мен <span\nclass=\"math inline\">\\(\\alpha\\)<\/span> арасындағы бұрыштың синусын\nтабыңыз. <strong>[2]<\/strong><\/p>\n<p><strong>2.<\/strong> Нүктеден жазықтыққа ұзындықтары 15 және 20\nболатын екі көлбеу жүргізілген. Олардың проекцияларының айырмасы 7.\nНүктеден жазықтыққа дейінгі қашықтықты табыңыз. <strong>[3]<\/strong><\/p>\n<p><strong>3.<\/strong> <span class=\"math inline\">\\(ABCD\\)<\/span> —\nқабырғасы 6 квадрат, <span class=\"math inline\">\\(SA\\perp(ABC)\\)<\/span>,\n<span class=\"math inline\">\\(SA=8\\)<\/span>. a) <span\nclass=\"math inline\">\\(BC\\perp SB\\)<\/span> екенін дәлелдеңіз. ә) <span\nclass=\"math inline\">\\(S\\)<\/span> нүктесінен <span\nclass=\"math inline\">\\(BC\\)<\/span> түзуіне дейінгі қашықтықты табыңыз. б)\n<span class=\"math inline\">\\(S\\)<\/span> нүктесінен <span\nclass=\"math inline\">\\(BD\\)<\/span> түзуіне дейінгі қашықтықты табыңыз.\n<strong>[3]<\/strong><\/p>\n<p><strong>4.<\/strong> 3-тапсырмадағы фигура үшін <span\nclass=\"math inline\">\\(SC\\)<\/span> түзуі мен <span\nclass=\"math inline\">\\(ABC\\)<\/span> жазықтығы арасындағы бұрыштың\nтангенсін табыңыз. <strong>[2]<\/strong><\/p>\n<p><strong>5.<\/strong> <span\nclass=\"math inline\">\\(ABCDA_1B_1C_1D_1\\)<\/span> — қыры 4 куб. <span\nclass=\"math inline\">\\(AA_1\\)<\/span> және <span\nclass=\"math inline\">\\(BD\\)<\/span> түзулерінің ортақ перпендикулярын\nсалып, олардың арақашықтығын табыңыз. <strong>[2]<\/strong><\/p>\n<p><strong>Барлығы: 12 балл<\/strong><\/p>\n"}, {"id": "v2", "name": "Нұсқа 2", "html": "<h1 id=\"бжб-2-нұсқа-2\">БЖБ 2 · Нұсқа 2<\/h1>\n<p><strong>Перпендикуляр және көлбеулер. Түзу мен жазықтық арасындағы\nбұрыш. Қашықтықтар<\/strong> · 25 мин · 12 балл<\/p>\n<p>Аты-жөні: ________________ і", "html": "<h1 id=\"бжб-2-балл-қою-кестесі\">БЖБ 2 · Балл қою кестесі<\/h1>\n<h2 id=\"нұсқа-1\">Нұсқа 1<\/h2>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Тапсырма<\/th>\n<th>Жауап / шешу жолы<\/th>\n<th>Балл<\/th>\n<th>Қосымша ақпарат<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>1<\/td>\n<td><span class=\"math inline\">\\(PH=\\sqrt{169-25}=12\\)<\/span><\/td>\n<td>1<\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><\/td>\n<td><span class=\"math inline\">\\(\\sin\\varphi=\\frac{12}{13}\\)<\/span><\/td>\n<td>1<\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>2<\/td>\n<td><span class=\"math inline\">\\(15^2-p^2=20^2-(p+7)^2\\)<\/span><\/td>\n<td>1<\/td>\n<td>Екеуіне ортақ перпендикуляр<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><\/td>\n<td><span class=\"math inline\">\\(p=9\\)<\/span> (проекциялар 9 және\n16)<\/td>\n<td>1<\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><\/td>\n<td><span class=\"math inline\">\\(h=\\sqrt{225-81}=12\\)<\/span><\/td>\n<td>1<\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>3a<\/td>\n<td><span class=\"math inline\">\\(BC\\perp AB\\)<\/span>, <span\nclass=\"math inline\">\\(BC\\perp SA\\)<\/span> ⇒ <span\nclass=\"math inline\">\\(BC\\perp(SAB)\\)<\/span> ⇒ <span\nclass=\"math inline\">\\(BC\\perp SB\\)<\/span><\/td>\n<td>1<\/td>\n<td>Немесе үш перпендикуляр туралы теорема<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>3b<\/td>\n<td><span class=\"math inline\">\\(SB=\\sqrt{64+36}=10\\)<\/span><\/td>\n<td>1<\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>3c<\/td>\n<td><span class=\"math inline\">\\(AO\\perp BD\\)<\/span> ⇒ <span\nclass=\"math inline\">\\(SO\\perp BD\\)<\/span>; <span\nclass=\"math inline\">\\(SO=\\sqrt{64+18}=\\sqrt{82}\\)<\/span><\/td>\n<td>1<\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>4<\/td>\n<td><span class=\"math inline\">\\(SC\\)<\/span> проекциясы >\n<tr class=\"even\">\n<td>3c<\/td>\n<td><span class=\"math inline\">\\(SO\\perp BD\\)<\/span>; <span\nclass=\"math inline\">\\(SO=\\sqrt{9+8}=\\sqrt{17}\\)<\/span><\/td>\n<td>1<\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>4<\/td>\n<td>Проекция <span class=\"math inline\">\\(AC=4\\sqrt2\\)<\/span><\/td>\n<td>1<\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><\/td>\n<td><span\nclass=\"math inline\">\\(\\tan\\varphi=\\frac{3}{4\\sqrt2}=\\frac{3\\sqrt2}{8}\\)<\/span><\/td>\n<td>1<\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>5<\/td>\n<td><span class=\"math inline\">\\(BO\\perp AC\\)<\/span>, <span\nclass=\"math inline\">\\(BO\\perp BB_1\\)<\/span><\/td>\n<td>1<\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><\/td>\n<td><span class=\"math inline\">\\(BO=3\\sqrt2\\)<\/span><\/td>\n<td>1<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Барлығы: 12<\/strong><\/p>\n"}, {"id": "ds", "name": "Дескрипторлар", "html": "<h1 id=\"бжб-2-дескрипторлар\">БЖБ 2 · Дескрипторлар<\/h1>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Бағалау критерийі<\/th>\n<th>Тапсырма<\/th>\n<th>Дескриптор: білім алушы<\/th>\n<th>Балл<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Перпендикуляр, көлбеу және оның проекциясы арасындағы байланысты\nқолданады<\/td>\n<td>1<\/td>\n<td>перпендикулярды табады<\/td>\n<td>1<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><\/td>\n<td><\/td>\n<td>жазықтықпен жасайтын бұрыштың синусын табады<\/td>\n<td>1<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><\/td>\n<td>2<\/td>\n<td>ортақ перпендикуляр үшін теңдеу құрады<\/td>\n<td>1<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><\/td>\n<td><\/td>\n<td>проекцияларды табады<\/td>\n<td>1<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><\/td>\n<td><\/td>\n<td>жазықтыққа дейінгі қашықтықты табады<\/td>\n<td>1<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Үш перпендикуляр туралы ық-бағалау-кеңістіктегі-перпендикулярлық\">ТЖБ\n2: 2-тоқсанға арналған жиынтық бағалау: кеңістіктегі\nперпендикулярлық<\/h1>\n<p><strong>Сынып:<\/strong> 10 · <strong>Пән:<\/strong> Геометрия ·\n<strong>Тоқсан:<\/strong> 2 · <strong>Сабақ:<\/strong> 15<\/p>\n<p><strong>Ұзақтығы:<\/strong> 40 мин · <strong>Жалпы балл:<\/strong>\n25<\/p>\n<h2 id=\"оқу-мақсаттары\">Оқу мақсаттары<\/h2>\n<ul>\n<li>10.2.9 кеңістіктегі екі түзудің арасындағы бұрыштың анықтамасын\nбілу<\/li>\n<li>10.2.8 перпендикуляр, көлбеу және проекция анықтамаларын білу;\n10.3.1 үш перпендикуляр туралы теорема<\/li>\n<li>10.3.2 түзу мен жазықтық арасындағы бұрыш; 10.3.5 нүктеден\nжазықтыққа дейінгі қашықтық<\/li>\n<li>10.3.3 жазықтықтар арасындағы бұрыштың (екіжақты бұрыштың)\nанықтамасын білу, оны салу және шамасын табу<\/li>\n<li>10.3.4 жазықтықтардың перпендикулярлық белгісі мен қасиеттерін білу\nжәне оларды есептер шығаруда қолдану<\/li>\n<\/ul>\n<h2 id=\"бағалау-критерийлері\">Бағалау критерийлері<\/h2>\n<ul>\n<li>Кеңістіктегі түзулер арасындағы бұрышты табады<\/li>\n<li>Перпендикулярлар мен көлбеулердің қасиеттерін қолданады<\/li>\n<li>Екіжақты бұрыштарды табады<\/li>\n<li>Перпендикуляр жазықтықтардың қасиеттерін қолданады<\/li>\n<li>Кеңістіктегі қашықтықтарды табады<\/li>\n<\/ul>\n<h2 id=\"ойлау-дағдыларының-деңгейлері\">Ойлау дағдыларының\nдеңгейлері<\/h2>\n<p>Білу және түсіну, Қолдану, Жоғары деңгейлі ойлау дағдылары<\/p>\n<h2 id=\"тапсырмалар-картасы\">Тапсырмалар картасы<\/h2>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Тапсырма<\/th>\n<th>Оқу мақсаты<\/th>\n<th>Ойлау деңгейі<\/th>\n<th>Балл<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>1<\/td>\n<td>10.2.9<\/td>\n<td>Білу және түсіну<\/td>\n<td>3<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>2<\/td>\n<td>10.2.8, 10.3.1, 10.3.2<\/td>\n<td>Қолдану<\/td>\n<td>4<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>3<\/td>\n<td>10.2.8<\/td>\n<td>Қолдану<\/td>\n<td>4<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>4<\/td>\n<td>10.3.3<\/td>\n<td>Қолдану<\/td>\n th inline\">\\(90^\\circ\\)<\/span>. Көлбеулердің табандарының\nарақашықтығын табыңыз. <strong>[4]<\/strong><\/p>\n<p><strong>4.<\/strong> <span class=\"math inline\">\\(ABC\\)<\/span> —\nқабырғасы 6 тең қабырғалы үшбұрыш, <span\nclass=\"math inline\">\\(AD\\perp(ABC)\\)<\/span>, <span\nclass=\"math inline\">\\(AD=3\\)<\/span>. <span\nclass=\"math inline\">\\(DBC\\)<\/span> және <span\nclass=\"math inline\">\\(ABC\\)<\/span> жазықтықтары арасындағы бұрышты\nтабыңыз. <strong>[4]<\/strong><\/p>\n<p><strong>5.<\/strong> <span class=\"math inline\">\\(\\alpha\\)<\/span> және\n<span class=\"math inline\">\\(\\beta\\)<\/span> жазықтықтары перпендикуляр\nжәне <span class=\"math inline\">\\(l\\)<\/span> түзуі бойымен қиылысады.\n<span class=\"math inline\">\\(A\\in\\alpha\\)<\/span>, <span\nclass=\"math inline\">\\(B\\in\\beta\\)<\/span>, <span\nclass=\"math inline\">\\(AC\\perp l\\)<\/span>, <span\nclass=\"math inline\">\\(BD\\perp l\\)<\/span> (<span\nclass=\"math inline\">\\(C,D\\in l\\)<\/span>). <span\nclass=\"math inline\">\\(AC=6\\)<\/span>, <span\nclass=\"math inline\">\\(BD=7\\)<\/span>, <span\nclass=\"math inline\">\\(CD=6\\)<\/span>. <span\nclass=\"math inline\">\\(AB\\)<\/span> табыңыз. <strong>[4]<\/strong><\/p>\n<p><strong>6.<\/strong> <span\nclass=\"math inline\">\\(ABCDA_1B_1C_1D_1\\)<\/span> — қыры 2 куб. <span\nclass=\"math inline\">\\(A\\)<\/span> нүктесінен <span\nclass=\"math inline\">\\(A_1BD\\)<\/span> жазықтығына дейінгі қашықтықты\nтабыңыз. <strong>[3]<\/strong><\/p>\n<p><strong>7.<\/strong> Қабырғасы 4 <span\nclass=\"math inline\">\\(ABCD\\)<\/span> квадраты <span\nclass=\"math inline\">\\(AC\\)<\/span> диагоналі бойымен <span\nclass=\"math inline\">\\(ABC\\)<\/span> және <span\nclass=\"math inline\">\\(ADC\\)<\/span> жазықтықтары перпендикуляр болатындай\nбүктелді. <span class=\"math inline\">\\(BD\\)<\/span> табыңыз.\n<strong>[3]<\/strong><\/p>\n<p><strong>Барлығы: 25 балл<\/strong><\/p>\n"}, {"id": "v2", "name": "Нұсқа 2", "html": "<h1 id=\"тжб- мышления<\/th>\n<th>Баллы<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>1<\/td>\n<td>10.2.8<\/td>\n<td>Знание и понимание<\/td>\n<td>2<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>2<\/td>\n<td>10.2.8<\/td>\n<td>Применение<\/td>\n<td>3<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>3<\/td>\n<td>10.3.1<\/td>\n<td>Применение<\/td>\n<td>3<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>4<\/td>\n<td>10.3.2<\/td>\n<td>Применение<\/td>\n<td>2<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>5<\/td>\n<td>10.3.5, 10.2.10<\/td>\n<td>Навыки высокого порядка<\/td>\n<td>2<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"порядок-проведения\">Порядок проведения<\/h2>\n<p>Два параллельных варианта. Калькулятор не разрешён. Каждый прямой\nугол, использованный в решении, должен быть обоснован.<\/p>\n<h2 id=\"рубрика-для-обратной-связи-родителям\">Рубрика для обратной связи\nродителям<\/h2>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Критерий оценивания<\/th>\n<th>Низкий<\/th>\n<th>Средний<\/th>\n<th>Высокий<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Использует перпендикуляр, наклонную, проекцию<\/td>\n<td>Затрудняется назвать элементы<\/td>\n<td>Допускает ошибки при составлении уравнений<\/td>\n<td>Правильно использует связь<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Применяет теорему о трёх перпендикулярах<\/td>\n<td>Затрудняется выбрать перпендикуляр<\/td>\n<td>Обосновывает не все прямые углы<\/td>\n<td>Правильно применяет теорему<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Находит угол между прямой и плоскостью<\/td>\n<td>Затрудняется найти проекцию<\/td>\n<td>Допускает вычислительные ошибки<\/td>\n<td>Правильно находит угол<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Находит расстояние между скрещивающимися прямыми<\/td>\n<td>Затрудняется построить общий перпендикуляр<\/td>\n<td>Строит его, но допускает вычислительные ошибки<\/td>\n<td>Правильно находит расстояние<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n"}, {"id": "v1", "name": "Вариант 1", "html": "<h1 id=\"сор-2-вариант-1\">СОР 2 · Вариант 1<\/h1>\n<p><strong>Перпендикуляр и наклонные. Угол между прямой и плоскостью.\nРасстояния<\/strong> · 25 мин · 12 баллов<\/p>\n<p>ФИО: ______________________ Класс: 10 ___ Дата: ________<\/p>\n<p><strong>1.<\/strong> <span class=\"math inline\">\\(PH\\)<\/span> —\nперпендикуляр, <span class=\"math inline\">\\(PA\\)<\/span> — наклонная к\nплоскости <span class=\"math inline\">\\(\\alpha\\)<\/span>. <span\nclass=\"math inline\">\\(PA=13\\)<\/span>, <span\nclass=\"math inline\">\\(HA=5\\)<\/span>. Найдите <span\nclass=\"math inline\">\\(PH\\)<\/span> и синус угла между <span\nclass=\"math inline\">\\(PA\\)<\/span> и <span\nclass=\"math inline\">\\(\\alpha\\)<\/span>. <strong>[2]<\/strong><\/p>\n<p><strong>2.<\/strong> Из точки к плоскости проведены две наклонные\nдлиной 15 и 20. Их проекции отличаются на 7. Найдите расстояние от точки\nдо плоскости. <strong>[3]<\/strong><\/p>\n<p><strong>3.<\/strong> <span class=\"math inline\">\\(ABCD\\)<\/span> —\nквадрат со стороной 6, <span\nclass=\"math inline\">\\(SA\\perp(ABC)\\)<\/span>, <span\nclass=\"math inline\">\\(SA=8\\)<\/span>. а) Докажите, что <span\nclass=\"math inline\">\\(BC\\perp SB\\)<\/span>. б) Найдите расстояние от\n<span class=\"math inline\">\\(S\\)<\/span> до прямой <span\nclass=\"math inline\">\\(BC\\)<\/span>. в) Найдите расстояние от <span\nclass=\"math inline\">\\(S\\)<\/span> до прямой <span\nclass=\"math inline\">\\(BD\\)<\/span>. <strong>[3]<\/strong><\/p>\n<p><strong>4.<\/strong> Для фигуры из задания 3 найдите тангенс угла\nмежду прямой <span class=\"math inline\">\\(SC\\)<\/span> и плоскостью <span\nclass=\"math inline\">\\(ABC\\)<\/span>. <strong>[2]<\/strong><\/p>\n<p><strong>5.<\/strong> <span\nclass=\"math inline\">\\(ABCDA_1B_1C_1D_1\\)<\/span> — куб с ребром 4.\nПостройте общий перпендикуляр прямых <span\nclass=\"math inline\">\\(AA_1\\)<\/span> и <span  со стороной 4 перегнули по AC в перпендикулярные плоскости. Найдите BD.", "fig": "g2-sat-2-7"}], "tabs": [{"id": "spec", "name": "Спецификация", "html": "<h1\nid=\"соч-2-суммативное-оценивание-за-2-четверть-перпендикулярность-в-пространстве\">СОЧ\n2: Суммативное оценивание за 2 четверть: перпендикулярность в\nпространстве<\/h1>\n<p><strong>Класс:<\/strong> 10 · <strong>Предмет:<\/strong> Геометрия ·\n<strong>Четверть:<\/strong> 2 · <strong>Урок:<\/strong> 15<\/p>\n<p><strong>Продолжительность:<\/strong> 40 мин · <strong>Всего\nбаллов:<\/strong> 25<\/p>\n<h2 id=\"цели-обучения\">Цели обучения<\/h2>\n<ul>\n<li>10.2.9 знать определение угла между двумя прямыми в\nпространстве<\/li>\n<li>10.2.8 знать определения перпендикуляра, наклонной и проекции;\n10.3.1 теорема о трёх перпендикулярах<\/li>\n<li>10.3.2 угол между прямой и плоскостью; 10.3.5 расстояние от точки до\nплоскости<\/li>\n<li>10.3.3 знать определение угла между плоскостями (двугранного угла),\nстроить его и находить его величину<\/li>\n<li>10.3.4 знать признак и свойства перпендикулярных плоскостей и\nприменять их при решении задач<\/li>\n<\/ul>\n<h2 id=\"критерии-оценивания\">Критерии оценивания<\/h2>\n<ul>\n<li>Находит угол между прямыми в пространстве<\/li>\n<li>Применяет свойства перпендикуляров и наклонных<\/li>\n<li>Находит двугранные углы<\/li>\n<li>Применяет свойства перпендикулярных плоскостей<\/li>\n<li>Находит расстояния в пространстве<\/li>\n<\/ul>\n<h2 id=\"уровни-мыслительных-навыков\">Уровни мыслительных навыков<\/h2>\n<p>Знание и понимание, Применение, Навыки высокого порядка<\/p>\n<h2 id=\"карта-заданий\">Карта заданий<\/h2>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Задание<\/th>\n<th>Цель обучения<\/th>\n<th>Уровень мышления<\/th>\n<th>Баллы<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>1<\/td>\n<td>10.2.9<\/td>\n<td>Знание и понимание<\/td>\n<td>3<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>2<\/td>\n<td>10.2.8, 10.3.1, 10.3.2<\/td>\n<td>Применение<\/td>\n<td>4<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>3<\/td>\n<td>10.2.8<\/td>\n<td>Применение<\/td>\n<td>4<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>4<\/td>\n<td>10.3.3<\/td>\n<td>Применение<\/td>\n<td>4<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>5<\/td>\n<td>10.3.4<\/td>\n<td>Применение<\/td>\n<td>4<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>6<\/td>\n<td>10.3.5<\/td>\n<td>Навыки высокого порядка<\/td>\n<td>3<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>7<\/td>\n<td>10.3.3, 10.3.4<\/td>\n<td>Навыки высокого порядка<\/td>\n<td>3<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"порядок-проведения\">Порядок проведения<\/h2>\n<p>Два параллельных варианта. Калькулятор не разрешён. Каждый прямой\nугол, использованный в решении, должен быть обоснован.<\/p>\n"}, {"id": "v1", "name": "Вариант 1", "html": "<h1 id=\"соч-2-вариант-1\">СОЧ 2 · Вариант 1<\/h1>\n<p><strong>Суммативное оценивание за 2 четверть: перпендикулярность в\nпространстве<\/strong> · 40 мин · 25 баллов<\/p>\n<p>ФИО: ______________________ Класс: 10 ___ Дата: ________<\/p>\n<p><strong>1.<\/strong> <span\nclass=\"math inline\">\\(ABCDA_1B_1C_1D_1\\)<\/span> — куб. Найдите угол\nмежду прямыми: а) <span class=\"math inline\">\\(AA_1\\)<\/span> и <span\nclass=\"math inline\">\\(BC\\)<\/span>; б) <span\nclass=\"math inline\">\\(AB_1\\)<\/span> и <span\nclass=\"math inline\">\\(BC_1\\)<\/span>. <strong>[3]<\/strong><\/p>\n<p><strong>2.<\/strong> <span\nclass=\"math inline\">\\(PA\\perp(ABC)\\)<\/span>, <span\nclass=\"math inline\">\\(ABCD\\)<\/span> — прямоугольник, <span\nclass=\"math inline\">\\(AB=3\\)<\/span>, <span\nclass=\"math inline\">\\(AD=4\\)<\/span>, <span\nclass=\"math inline\">\\(PA=12\\)<\/span>. а) Найдите <span\nclass=\"math inline\">\\(PC\\)<\/span>. б) Докажите, что <span\nclass=\"math inline\">\\(CD\\perp PD\\)<\/span>. в) Найдите синус угла между\n<span class=\"math inline\">\\(PC\\)<\/span> и плоскостью <span\nclass=\"math inline\">\\(ABC\\)<\/span>. <strong>[4]<\/strong><\/p>\n<p><strong>3.<\/strong> Точка удалена от плоскости на 8. Из неё проведены\nдве наклонные длиной 10 и <span class=\"math inline\">\\(8\\sqrt2\\)<\/span>.\nУгол между их проекциями равен <span\nclass=\"math inline\">\\(90^\\circ\\)<\/span>. Найдите расстояние между\nоснованиями наклонных. <strong>[4]<\/strong><\/p>\n<p><strong>4.<\/strong> <span class=\"math inline\">\\(ABC\\)<\/span> —\nравносторонний треугольник со стороной 6, <span\nclass=\"math inline\">\\(AD\\perp(ABC)\\)<\/span>, <span\nclass=\"math inline\">\\(AD=3\\)<\/span>. Найдите угол между плоскостями\n<span class=\"math inline\">\\(DBC\\)<\/span> и <span\nclass=\"math inline\">\\(ABC\\)<\/span>. <strong>[4]<\/strong><\/p>\n<p><strong>5.<\/strong> Плоскости <span\nclass=\"math inline\">\\(\\alpha\\)<\/span> и <span\nclass=\"math inline\">\\(\\beta\\)<\/span> перпендикулярны и пересекаются по\n<span class=\"math inline\">\\(l\\)<\/span>. <span\nclass=\"math inline\">\\(A\\in\\alpha\\)<\/span>, <span\nclass=\"math inline\">\\(B\\in\\beta\\)<\/span>, <span\nclass=\"math inline\">\\(AC\\perp l\\)<\/span>, <span\nclass=\"math inline\">\\(BD\\perp l\\)<\/span> (<span\nclass=\"math inline\">\\(C,D\\in l\\)<\/span>). <span\nclass=\"math inline\">\\(AC=6\\)<\/span>, <span\nclass=\"math inline\">\\(BD=7\\)<\/span>, <span\nclass=\"math inline\">\\(CD=6\\)<\/span>. Найдите <span\nclass=\"math inline\">\\(AB\\)<\/span>. <strong>[4]<\/strong><\/p>\n<p><strong>6.<\/strong> <span\nclass=\"math inline\">\\(ABCDA_1B_1C_1D_1\\)<\/span> — куб с ребром 2.\nНайдите расстояние от <span class=\"math inline\">\\(A\\)<\/span> до\nплоскости <span class=\"math inline\">\\(A_1BD\\)<\/span>.\n<strong>[3]<\/strong><\/p>\n<p><strong>7.<\/strong> Квадрат <span class=\"math inline\">\\(ABCD\\)<\/span>\nсо стороной 4 перегнули по диагонали <span\nclass=\"math inline\">\\(AC\\)<\/span> так, что плоскости <span\nclass=\"math inline\">\\(ABC\\)<\/span> и <span\nclass=\"math inline\">\\(ADC\\)<\/span> перпендикулярны. Найдите <span\nclass=\"math inline\">\\(BD\\)<\/span>. <strong>[3]<\/strong><\/p>\n<p> const LI = () => ({ kz: 0, en: 1, ru: 2 })[LANG];
function t(k, ...a) { const e = UI[k]; let s = e ? e[LI()] : k; a.forEach((v, i) => { s = s.replace('{' + i + '}', v); }); return s; }
function figT(k) { return k === 'studio' ? t('studio') : t(k); }
const FIG_WORDS = { projection: ['проекция', 'projection', 'проекция'], angle: ['бұрыш', 'angle', 'угол'], normal: ['нормаль', 'normal', 'нормаль'], same: ['дәл осылай', 'same', 'так же'] };
function figLabel(s) { if (!s || LANG === 'en') return s; return s.replace(/\b(projection|angle|normal|same)\b/g, w => FIG_WORDS[w][LI()]); }
const termName = k => t(k === 't2' ? 'term2' : 'term3');
/* term data in the current language (Term 2 is translated; Term 3 falls back to English) */
const termData = k => (LANG !== 'en' && ROOT.tr && ROOT.tr[LANG] && ROOT.tr[LANG][k]) || ROOT.terms[k];
const asmData = k => (LANG !== 'en' && ASM.tr && ASM.tr[LANG] && ASM.tr[LANG][k]) || ASM[k];
const isTr = () => LANG !== 'en' && !!(ROOT.tr && ROOT.tr[LANG] && ROOT.tr[LANG][TK]);
function labsData() { const tr = LANG !== 'en' && ROOT.tr && ROOT.tr[LANG] && ROOT.tr[LANG].labs; return ROOT.labs.map(l => { const x = tr && tr.find(y => y.id === l.id); return x ? Object.assign({}, l, { name: x.name, desc: x.desc }) : l; }); }
const cycleData = () => (LANG !== 'en' && ROOT.tr && ROOT.tr[LANG] && ROOT.tr[LANG].cycle) || ROOT.cycle;
const glossRow = (en, v) => `<td>${v[0]}</td><td>${en}</td><td>${v[1]}</td>`;

let D = ROOT, TK = 't2', T = ROOT.terms.t2, A = ASM.t2;
const taught = new Set((store('geo10-taught') || '').split(',').filter(Boolean));
function saveTaught() { store('geo10-taught', [...taught].join(',')); }
const unitOf = id => T.units.find(u => u.id === id);
let pendingPreset = null;

function setTerm(k, force) {
  if (!ROOT.terms[k]) k = 't2';
  if (TK === k && T && !force) { return; }
  TK = k; T = termData(k); A = asmData(k); store('geo10-term', k); buildChrome();
}
function setLang(l) {
  if (l === LANG) return; LANG = l; store('geo10-lang', l); document.documentElement.lang = l === 'kz' ? 'kk' : l;
  setTerm(TK, true); route(true);
}
function buildChrome() {
  document.documentElement.lang = LANG === 'kz' ? 'kk' : LANG;
  $('#hdrEyebrow').textContent = t('eyebrow');
  $('#hdrTitle').innerHTML = T.title; $('#hdrSub').innerHTML = T.sub;
  $('#termSw').setAttribute('aria-label', t('term2').replace(/\d/g, '').trim());
  $('#termSw').innerHTML = Object.keys(ROOT.terms).map(k => `<a href="#${k}" aria-current="${k === TK}">${termName(k)}</a>`).join('');
  $('#langSw').innerHTML = LANGS.map(([k, s, n]) => `<button type="button" data-lang="${k}" aria-pressed="${k === LANG}" title="${n}" lang="${k === 'kz' ? 'kk' : k}">${s}</button>`).join('');
  $('#heroCv').title = t('heroTip');
  $('#mnavLbl').textContent = t('goto');
  $('#prFull').textContent = t('full'); $('#prClose').textContent = t('close'); $('#prPrev').textContent = t('back');
  $('#tabs').innerHTML = [['home', t('home')], [`${TK}-lesson-${store('geo10-last-' + TK) || 1}`, t('lessons'), 'lesson'], ['studio', t('studio')], ['labs', t('labs')], [`${TK}-theory`, t('theory'), 'theory'], [`${TK}-assessment`, t('assessment'), 'assessment']]
    .map(([h, n, k]) => `<a class="tab" href="#${h}" data-tab="${k || h}">${n}</a>`).join('');
  $('#cells').innerHTML = T.lessons.map(l => { const u = unitOf(l.unit); return `<button class="cell${l.sas ? ' as' : ''}${l.sat ? ' sat' : ''}${taught.has(TK + '-' + l.k) ? ' done' : ''}" data-k="${l.k}" title="${l.k}. ${l.title.replace(/<[^>]+>/g, '').replace(/"/g, '&quot;')}" style="background:${u ? u.color : 'var(--ink)'}"></button>`; }).join('');
  let h = `<h4>${t('lessons')}</h4>`, cur = null;
  T.lessons.forEach(l => {
    if (l.unit !== cur) { cur = l.unit; const u = unitOf(cur); h += u ? `<div class="unit"><i style="background:${u.color}"></i>${u.code} ${u.name}</div>` : `<div class="unit"><i style="background:var(--ink)"></i>${t('closure')}</div>`; }
    const tg = l.sas || l.sat ? `<span class="tag">${l.sas || l.sat}</span>` : '';
    h += `<a class="item${taught.has(TK + '-' + l.k) ? ' done' : ''}" href="#${TK}-lesson-${l.k}" data-h="${TK}-lesson-${l.k}"><span>${l.k}</span><span>${l.title}${tg}</span></a>`;
  });
  h += `<h4>${t('handbook')}</h4><a class="item" href="#${TK}-theory" data-h="${TK}-theory"><span>§</span><span>${t('theoryItem')}</span></a>`;
  h += `<h4>${t('tools')}</h4><a class="item" href="#studio" data-h="studio"><span>◆</span><span>${t('studio')}</span></a>` + labsData().filter(x => x.term === TK).map(x => `<a class="item" href="#lab-${x.id}" data-h="lab-${x.id}"><span>◇</span><span>${x.name}</span></a>`).join('');

  $('#side').innerHTML = h;

}
$('#langSw').addEventListener('click', e => { const b = e.target.closest('[data-lang]'); if (b) setLang(b.dataset.lang); });
$('#cells').addEventListener('click', e => { const b = e.target.closest('.cell'); if (b) location.hash = `${TK}-lesson-${b.dataset.k}`; });
$('#mnavSel').addEventListener('change', e => { location.hash = e.target.value; });

      const ast = stParse(stTokens(rhs)); const lit = ast.num !== undefined || (ast.op === 'neg' && ast.a.num !== undefined);
      return { kind: 'def', name: lhs.replace(/[₀-₉]/g, d => String(d.charCodeAt(0) - 8320)), ast, slider: lit };
    }

function viewAssess(id) { const a = A.find(x => x.id === id); if (!a) return viewAssessIndex(); return enNote() + `<div class="view-head"><div class="eyebrow">${asmMeta(a)}</div><h2>${a.title}</h2></div><div class="asm-tabs" id="asmTabs">${a.tabs.map(tb => `<button type="button" data-t="${tb.id}" aria-pressed="${tb.id === asmTab}">${tb.name}</button>`).join('')}${a.figs && a.figs.length ? `<button type="button" data-t="figs" aria-pressed="${asmTab === 'figs'}">${t('solFigs')}</button>` : ''}</div><div class="paper mjx" id="asmBody"></div>`; }
function afterAssess(id) {
  const a = A.find(x => x.id === id); if (!a) return;
  if (!a.tabs.some(tb => tb.id === asmTab) && !(asmTab === 'figs' && a.figs)) asmTab = a.tabs[0].id;
  const show = () => {
    if (asmTab === 'figs') { $('#asmBody').innerHTML = `<p class="lead" style="font-size:16px">${t('figLead')}</p>` + a.figs.map(f => `<div class="wex"><div><div class="lbl">${t('task')} ${f.task}</div><p class="q">${f.text}</p></div><div class="fig" data-fig="${f.fig}" data-h="320"></div></div>`).join(''); mountFigs($('#asmBody')); }
    else { const tb = a.tabs.find(x => x.id === asmTab); $('#asmBody').innerHTML = tb.html; $('#asmBody').querySelectorAll('table').forEach(tbl => { if (!tbl.parentElement.classList.contains('table-wrap')) { const d = document.createElement('div'); d.className = 'table-wrap'; tbl.replaceWith(d); d.appendChild(tbl); } }); }
    typeset($('#asmBody')); $('#asmTabs').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.t === asmTab));
  };
  $('#asmTabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; asmTab = b.dataset.t; show(); };
  show();
}

/* ---------- hero cube ---------- */
(function hero() {
  const cv = $('#heroCv'); if (!cv || !cv.getContext) return;
  const sc = new Scene3D(cv, { yaw: -0.5, pitch: 0.4, h: 170, scale: 0.3, center: [0.5, 0.5, 0.5] });
  const V = boxV(1, 1, 1);
  sc.render([{ t: 'solid', V, F: CUBE_F, c: COL.ink, w: 1.6, fill: 'rgba(36,80,184,.06)' }, { t: 'poly', p: [V[4], V[1], V[3]], fill: 'rgba(209,143,0,.35)', stroke: '#d18f00' }, { t: 'seg', a: V[0], b: [1 / 3, 1 / 3, 1 / 3], c: '#d18f00', w: 2.6 }, { t: 'pt', p: [1 / 3, 1 / 3, 1 / 3], r: 3, c: '#d18f00' }]);
  const run = !matchMedia('(prefers-reduced-motion: reduce)').matches;
  const loop = () => { if (run && document.visibilityState === 'visible') { sc.yaw -= 0.004; sc.render(); } requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  cv.addEventListener('dblclick', () => { location.hash = 'studio'; });
})();

/* ---------- router ---------- */
let activeLab = null;
function route(keepScroll) {
  let hsh = (location.hash || '').slice(1);
  if (!hsh) hsh = 'home';
  const tm = hsh.match(/^(t[23])(?:-(.*))?$/);
  if (tm) { setTerm(tm[1]); hsh = tm[2] ? tm[1] + '-' + tm[2] : 'home'; }
  if (activeLab && LABS[activeLab].unmount) LABS[activeLab].unmount(); activeLab = null;
  const v = $('#view'); let tab = 'home', m;
  const rest = hsh.startsWith(TK + '-') ? hsh.slice(3) : hsh;
  if ((m = rest.match(/^lesson-(\d+)$/))) { tab = 'lesson'; v.innerHTML = viewLesson(+m[1]); afterLesson(+m[1]); }
  else if (rest === 'theory') { tab = 'theory'; v.innerHTML = viewTheory(); }
  else if (rest === 'assessment') { tab = 'assessment'; v.innerHTML = viewAssessIndex(); }
  else if (A.some(x => x.id === rest)) { tab = 'assessment'; v.innerHTML = viewAssess(rest); afterAssess(rest); }
  else if (hsh === 'labs') { tab = 'labs'; v.innerHTML = viewLabs(); }
  else if (hsh === 'studio' || ((m = hsh.match(/^lab-([a-z]+)$/)) && LABS[m[1]])) {
    const id = hsh === 'studio' ? 'studio' : m[1]; tab = id === 'studio' ? 'studio' : 'labs';
    const lb = ROOT.labs.find(x => x.id === id); if (lb && lb.term !== TK) { setTerm(lb.term); }
    v.innerHTML = viewLab(id); const lab = LABS[id];
    if (pendingPreset && pendingPreset.id === id) { Object.assign(lab.state, pendingPreset.p); pendingPreset = null; }
    $('#labroot').innerHTML = lab.html(); activeLab = id; lab.mount(); typeset($('#labroot'));
  }
  else { tab = 'home'; v.innerHTML = viewHome(); }
  document.querySelectorAll('.tab').forEach(a => a.setAttribute('aria-current', a.dataset.tab === tab));
  const full = tab === 'studio' || tab === 'labs' ? hsh : (tab === 'home' ? 'home' : TK + '-' + rest);
  document.querySelectorAll('#side a.item').forEach(a => a.setAttribute('aria-current', a.dataset.h === full));
  document.querySelectorAll('.cell').forEach(c => c.classList.toggle('on', `${TK}-lesson-${c.dataset.k}` === full));
  $('#mnavSel').value = [...$('#mnavSel').options].some(o => o.value === full) ? full : 'home';
  const cur = document.querySelector('#side a.item[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest' });
  mountFigs(v); if (!activeLab) typeset(v);
  if (!keepScroll) window.scrollTo({ top: 0 });
}
const startTerm = store('geo10-term'); TK = ''; setTerm(startTerm === 't3' ? 't3' : 't2');
window.addEventListener('hashchange', () => route());
route();
})();
</script>
